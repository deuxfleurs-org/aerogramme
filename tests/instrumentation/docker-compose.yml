services:
  dovecot:
    image: dovecot/dovecot:2.4.3
    environment:
      USER_PASSWORD: "pass"
    ports:
      - "993:31993/tcp"

  maddy:
    build:
      context: ./docker/maddy/
    image: maddy
    ports:
      - "994:993/tcp"

  cyrus:
    build:
      context: ./docker/cyrus/
    image: cyrus
    volumes:
      - "/dev/log:/dev/log"
    ports:
      - "143:143/tcp"

  courier:
    build:
      context: ./docker/courier/
    image: courier
    ports:
      - "144:144/tcp"
