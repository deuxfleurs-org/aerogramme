[workspace]
resolver = "2"
members = [
  "aero-bayou",
  "aero-collections",
  "aero-dav",
  "aero-ical",
  "aero-proto",
  "aero-sasl",
  "aero-user",
  "aero-vcard",
  "smtp-message",
  "smtp-server",
  "smtp-server-types",
  "aero-dav/fuzz",
  "aerogramme",
]

default-members = ["aerogramme"]

[workspace.dependencies]
# internal vendored/forked crates
smtp-message = { version = "0.5.1", path = "smtp-message" }
smtp-server = { version = "0.5.1", path = "smtp-server" }
smtp-server-types = { version = "0.5.1", path = "smtp-server-types" }

# internal core crates
aero-bayou = { version = "0.5.1", path = "aero-bayou" }
aero-collections = { version = "0.5.1", path = "aero-collections" }
aero-dav = { version = "0.5.1", path = "aero-dav" }
aero-ical = { version = "0.5.1", path = "aero-ical" }
aero-proto = { version = "0.5.1", path = "aero-proto" }
aero-sasl = { version = "0.5.1", path = "aero-sasl" }
aero-user = { version = "0.5.1", path = "aero-user" }
aero-vcard = { version = "0.5.1", path = "aero-vcard" }
aerogramme = { version = "0.5.1", path = "aerogramme" }

# async runtime
smol = "1" # Used by Kannader imported crates; maybe we'll want to rewrite to tokio.
piper = "0.1" # Used by Kannader imported crates; maybe we'll want to rewrite code using it with a tokio primitive
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "io-util", "net", "time", "macros", "sync", "signal", "fs"] }
tokio-util = { version = "0.7", features = [ "compat" ]  }
tokio-stream = { version = "0.1" }
futures = { version = "0.3", features = ["write-all-vectored"] }

# debug
log = "0.4"
backtrace = "0.3"
tracing-subscriber = "0.3"
tracing = "0.1"
thiserror = "1"

# language extensions
auto_enums = "0.8"
lazy_static = "1"
duplexify = "1"
im = "15"
anyhow = "1"
async-trait = "0.1"
pin-project = "1"
maplit = "1"
itertools = "0.15"
chrono = { version = "0.4", features = ["alloc"] }

# text encoding
# TODO: replace with std::char::to_titlecase when it becomes stable
unicode-case-mapping = "1.0.0"
unicode-normalization = "0.1.25"
idna = "1"

# process related
nix = { version = "0.30", features = ["signal"] }
clap = { version = "3", features = ["derive", "env"] }

# email protocols
eml-codec = "0.4.1"
imap-codec = { version = "2.0.0", features = ["bounded-static", "ext_condstore_qresync"] }
imap-flow = { git = "https://github.com/duesee/imap-next.git", rev = "dce759a8531f317e8d7311fb032b366db6698e38" }

# dav protocols
icalendar = "0.16"
ical_vcard = "0.5.0"

# http & web
http = "1.3"
http-body-util = "0.1.3"
hyper = "1.7"
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.12", features = [ "blocking" ]} # for testing purposes only

# serialization, compression & parsing
regex-automata = "0.1" # can't upgrade past 0.1 without rewriting code
serde = { version = "1.0", features = [ "serde_derive" ] }
rmp-serde = "1.3"
toml = "0.9"
base64 = "0.22"
hex = "0.4"
nom = "7"
quick-xml = { version = "0.38", features = ["async-tokio"] }
zstd = { version = "0.13", default-features = false }

# cryptography & security
sodiumoxide = "0.2"
argon2 = "0.5"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", ] }
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
rpassword = "7"

# login
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls", "tls-rustls-ring"] }

# storage
k2v-client = { git = "https://git.deuxfleurs.fr/Deuxfleurs/garage.git", branch = "main-v2" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-smithy-runtime = "1"
aws-smithy-runtime-api = "1"

# testing
quickcheck = "1"
quickcheck_macros = "1"

[patch.crates-io]
imap-types = { git = "https://github.com/superboum/imap-codec", branch = "custom/aerogramme" }
imap-codec = { git = "https://github.com/superboum/imap-codec", branch = "custom/aerogramme" }
